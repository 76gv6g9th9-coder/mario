<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P2 灯语 · 车内舱版</title><link rel="stylesheet" href="guide.css?v=42"><style>
*{box-sizing:border-box}body{margin:0;background:#08090b;overflow:hidden}#cabin{position:absolute;width:2048px;height:864px;transform-origin:0 0}#cabin img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#night{opacity:0;transition:opacity 2s linear}#display{position:absolute;left:623px;top:198px;width:828px;height:479px;overflow:hidden;background:#08090b}iframe{border:0;width:2560px;height:1440px;transform:scale(.3234375,.332638889);transform-origin:0 0}#zoom{position:fixed;right:24px;bottom:20px;display:flex;align-items:center;gap:12px;padding:12px 18px;border:1px solid #ffffff25;border-radius:28px;background:#17191be8;color:#eee;font:13px 'Microsoft YaHei',sans-serif;box-shadow:0 4px 24px #0005}input{width:180px;accent-color:#ffeb30}button{background:none;border:0;color:inherit;cursor:pointer}input:focus-visible,button:focus-visible{outline:2px solid #ffeb30}
body{background:#111210}#zoom{background:#1c1e19ed;border-color:#d5ef7830;border-radius:12px;box-shadow:none;font-family:Arial,"Microsoft YaHei",sans-serif}input{accent-color:#d5ef78}input:focus-visible,button:focus-visible{outline-color:#d5ef78}</style><div id="cabin"><img src="assets/images/车内舱_1.png" alt="汽车内舱"><img id="night" src="assets/images/车内舱_2.png" alt=""><div id="display"><iframe id="demo" src="demo.html" title="P2灯语交互演示" allow="autoplay; fullscreen"></iframe></div></div><div id="zoom"><button id="min" title="车内舱全景">全景</button><input id="slider" aria-label="界面缩放" type="range" min="0" max="100" value="50"><button id="max" title="界面满屏">界面</button></div><script>
const cabin=document.getElementById('cabin'),slider=document.getElementById('slider'),embedded=new URLSearchParams(location.search).get('embedded')==='1';function layout(){
 const t=Number(slider.value)/100,w=innerWidth,h=innerHeight,a=(embedded?Math.max:Math.min)(w/2048,h/864);
 const baseX=(w-2048*a)/2,baseY=(h-864*a)/2,anchorX=baseX+1037*a,anchorY=baseY+437.5*a;
 const fit=Math.min(anchorX/414,(w-anchorX)/414,anchorY/239.5,(h-anchorY)/239.5),b=Math.max(a,fit),s=a+(b-a)*t;
 const x=anchorX-1037*s,y=anchorY-437.5*s;
 cabin.style.transform=`translate(${x}px,${y}px) scale(${s})`;
}slider.oninput=layout;document.getElementById('min').onclick=()=>{slider.value=0;layout()};document.getElementById('max').onclick=()=>{slider.value=100;layout()};addEventListener('resize',layout);addEventListener('message',e=>{if(e.source===document.getElementById('demo').contentWindow&&e.data?.type==='cabin-scene')document.getElementById('night').style.opacity=e.data.home?'0':'1'});layout();
</script><script src="guide.js?v=33"></script></html>
